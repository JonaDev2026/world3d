<style>

</head>

gate(0,330,0);gate(-330,0,Math.PI/2);gate(330,0,Math.PI/2);

function roofMesh(parent,w,d,h,material){const geo=new THREE.BufferGeometry();const v=[-w/2,0,-d/2,w/2,0,-d/2,0,h,-d/2,-w/2,0,d/2,w/2,0,d/2,0,h,d/2,-w/2,0,-d/2,-w/2,0,d/2,0,h,0,w/2,0,-d/2,w/2,0,d/2,0,h,0];geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));geo.setIndex([0,1,2,3,5,4,6,7,8,9,11,10]);geo.computeVertexNormals();const m=new THREE.Mesh(geo,material);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}

let bcount=0;let seedRand=9173;function rnd(){seedRand=(seedRand*16807)%2147483647;return (seedRand-1)/2147483646}
const districts=[[-278,-228,4],[-168,-274,3],[28,-250,5],[218,-268,4],[-286,-112,3],[263,-145,4],[-242,118,5],[278,168,3],[-208,268,4],[-72,226,4],[118,278,3],[254,238,5],[-272,22,3],[236,48,4],[-142,112,3],[172,-92,4],[-184,-62,3],[126,128,3]];

function stall(x,z,cloth){const g=new THREE.Group();g.position.set(x,0,z);city.add(g);for(let xx of [-4,4])for(let zz of [-3,3])box(g,xx,4,zz,.7,8,.7,wood[0]);box(g,0,7,0,11,.8,8,wood[1]);const canopy=box(g,0,9,0,12,1,9,cloth);canopy.rotation.x=.03;box(g,0,3.4,0,10,1,7,wood[0]);for(let n=-3;n<=3;n+=2)box(g,n,4.4,3.2,1.2,1.3,1.2,wood[2])}
for(let i=0;i<8;i++){stall(-65+(i%4)*42, -25+Math.floor(i/4)*45, i%2?mat(0x8b5140):mat(0xb7a16f));city.children[city.children.length-1].scale.setScalar(.62)}
// lanterns and street furniture
function lamp(x,z){const g=new THREE.Group();g.position.set(x,0,z);city.add(g);cyl(g,0,5,0,.35,.5,10,darkStone,8);cyl(g,0,10.5,0,1.1,1.1,1,gold,8);box(g,0,13,0,2.8,3,2.8,glass);for(let dx of [-1.6,1.6])box(g,dx,13,0,.25,3,.25,wood[0]);for(let dz of [-1.6,1.6])box(g,0,13,dz, .25,3,.25,wood[0]);cyl(g,0,15,0,1.7,.1,1.2,darkStone,8)}
for(let x=-290;x<=290;x+=58)for(let z=-290;z<=290;z+=58){lamp(x,z);city.children[city.children.length-1].scale.setScalar(.28)}
// benches
function bench(x,z,rot=0){const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;city.add(g);box(g,0,2,0,12,1,3,wood[1]);for(let xx of [-4,4]){box(g,xx,1,0,1,2,3,wood[0]);box(g,xx,4,-1,1,5,1,wood[0])}}
for(let a=0;a<4;a++){bench(Math.cos(a*Math.PI/2)*58,Math.sin(a*Math.PI/2)*58,a*Math.PI/2);city.children[city.children.length-1].scale.setScalar(.5)}
// trees with branching trunks and clustered foliage
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);city.add(g);cyl(g,0,5,0,1.1,1.7,10,wood[1],7);for(let a=0;a<4;a++){const q=a*Math.PI/2;cyl(g,Math.sin(q)*1.7,8,Math.cos(q)*1.7,.35,.8,7,wood[1],6)}for(let i=0;i<8;i++){const a=i*2.4;const m=sphere(g,Math.cos(a)*3,10+(i%3)*2,Math.sin(a)*3,4,leafMats[i%3],1.2,1.1,1.1);m.rotation.y=a}sphere(g,0,15,0,5,leafMats[1],1.2,1.2,1.2)}
for(let z=-300;z<=300;z+=42){tree(-300,z,.8+Math.random()*.4);tree(300,z,.8+Math.random()*.4)}
for(let x=-290;x<=290;x+=42){tree(x,-300,.8+Math.random()*.4);tree(x,300,.8+Math.random()*.4)}
for(const [x,z] of [[-90,95],[90,95],[-90,-95],[90,-95],[-125,0],[125,0]])tree(x,z,1.1);
// little details: steps, barrels, crates, well, fences
function barrel(x,z){const g=new THREE.Group();g.position.set(x,0,z);city.add(g);cyl(g,0,2,0,1.6,1.8,4,wood[1],10);for(let y of [.7,3.3])cyl(g,0,y,0,1.9,1.9,.25,darkStone,10)}
for(let i=0;i<24;i++){barrel(-280+(i*47)%560,-280+(i*83)%560);city.children[city.children.length-1].scale.setScalar(.45)}
function crate(x,z){const g=new THREE.Group();g.position.set(x,0,z);city.add(g);box(g,0,2,0,4,4,4,wood[1]);for(let xx of [-1.5,1.5])box(g,xx,2,2.1,.3,4,.2,wood[0]);box(g,0,2,2.2,3.8,.3,.25,wood[0])}
for(let i=0;i<18;i++){crate(-110+(i*29)%220,90+(i%3)*6);city.children[city.children.length-1].scale.setScalar(.5)}
// surrounding fields and footpaths outside walls
for(let i=0;i<75;i++){const x=(Math.random()-.5)*1100,z=(Math.random()-.5)*1100;if(Math.abs(x)<345&&Math.abs(z)<345)continue;for(let n=0;n<4;n++){const m=new THREE.Mesh(new THREE.ConeGeometry(.35+Math.random()*.35,1.5+Math.random()*2,5),leafMats[n%3]);m.position.set(x+n*2,1,z+n*1.4);city.add(m)}}
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
let locked=false;renderer.domElement.addEventListener('click',()=>{if(started)renderer.domElement.requestPointerLock()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!locked)return;yaw.rotation.y-=e.movementX*.0022;pitch.rotation.x-=e.movementY*.0022;pitch.rotation.x=THREE.MathUtils.clamp(pitch.rotation.x,-1.45,1.45)});
let started=false;document.querySelector('#enter').addEventListener('click',()=>{started=true;document.querySelector('#loading').classList.add('hide');document.querySelector('#hud').classList.add('active');renderer.domElement.requestPointerLock()});
document.querySelector('#progress').style.width='100%';document.querySelector('#loadtext').textContent='La città è pronta.';document.querySelector('#enter').style.display='inline-block';
let last=performance.now(),districtTimer=0;
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(started){const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);const l=Math.hypot(f,s)||1,spd=(keys.ShiftLeft||keys.ShiftRight?34:15)*dt,a=yaw.rotation.y;if(f||s){const dx=(-Math.sin(a)*f+Math.cos(a)*s)/l*spd,dz=(-Math.cos(a)*f-Math.sin(a)*s)/l*spd;const nx=yaw.position.x+dx,nz=yaw.position.z+dz;if(!blocked(nx,yaw.position.z))yaw.position.x=nx;if(!blocked(yaw.position.x,nz))yaw.position.z=nz;}yaw.position.x=THREE.MathUtils.clamp(yaw.position.x,-370,370);yaw.position.z=THREE.MathUtils.clamp(yaw.position.z,-370,370);yaw.position.y=1.72;districtTimer+=dt;if(districtTimer>.3){districtTimer=0;const x=yaw.position.x,z=yaw.position.z;document.querySelector('#district').textContent=Math.abs(x)<85&&Math.abs(z)<85?'PIAZZA DELLA CATTEDRALE':Math.abs(x)>275||Math.abs(z)>275?'LE MURA E LE PORTE':Math.abs(x)<150&&Math.abs(z)<150?'IL BORGO ANTICO':z>150?'IL QUARTIERE ALTO':z< -150?'IL MERCATO VECCHIO':'IL QUARTIERE DEL FIUME'}}renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script></body></html>
