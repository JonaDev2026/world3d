name: Civilization browser verification

on:
  push:
    branches:
      - main
    paths:
      - "civilization/**"
      - ".github/workflows/civilization-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test motore e moduli
        run: npm test
        working-directory: civilization

      - name: Install browser test dependency
        run: npm install --no-save playwright@1.56.1
        working-directory: civilization

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: civilization

      - name: Test Web Worker, IndexedDB and offline recovery
        working-directory: civilization
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {createServer} from "node:http";
          import {readFile} from "node:fs/promises";
          import {resolve,extname,sep} from "node:path";
          import {chromium} from "playwright";

          const root=resolve(process.cwd(),"..");
          const mime={".html":"text/html; charset=utf-8",".js":"text/javascript; charset=utf-8",".css":"text/css; charset=utf-8"};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const serial=w=>w.year*365+w.day;
          const checkpoint=page=>page.evaluate(()=>new Promise((resolve,reject)=>{
            const open=indexedDB.open("anno-zero-civilization",1);
            open.onerror=()=>reject(open.error);
            open.onsuccess=()=>{
              const db=open.result,get=db.transaction("state","readonly").objectStore("state").get("world");
              get.onerror=()=>{db.close();reject(get.error);};
              get.onsuccess=()=>{
                const w=get.result;db.close();
                resolve(w?{year:w.year,day:w.day,speed:w.speed,paused:w.paused,lastWallTime:w.lastWallTime,population:w.population.filter(p=>p.alive).length}:null);
              };
            };
          }));

          const server=createServer(async(req,res)=>{
            try{
              const path=resolve(root,"."+decodeURIComponent(new URL(req.url,"http://localhost").pathname));
              if(!path.startsWith(root+sep)){res.writeHead(403).end();return;}
              const data=await readFile(path);
              res.writeHead(200,{"content-type":mime[extname(path)]||"application/octet-stream","cache-control":"no-store"});
              res.end(data);
            }catch{res.writeHead(404).end();}
          });
          await new Promise((resolve,reject)=>{server.once("error",reject);server.listen(0,"127.0.0.1",resolve);});
          let browser;
          try{
            browser=await chromium.launch({headless:true});
            const context=await browser.newContext(),url="http://127.0.0.1:"+server.address().port+"/civilization/index.html",errors=[];
            let page=await context.newPage();
            page.on("pageerror",e=>errors.push(e.message));
            const worker=page.waitForEvent("worker",{timeout:20000});
            await page.goto(url,{waitUntil:"domcontentloaded"});
            assert.ok((await worker).url().includes("sim-worker.js"),"module Web Worker did not start");
            await page.waitForFunction(()=>{
              const s=document.querySelector("#saveState")?.textContent||"";
              return document.querySelector("#errorPanel")?.hidden&&(s.includes("Nuova simulazione inizializzata")||s.includes("Stato ripristinato e salvato"));
            },null,{timeout:30000});
            await page.locator("#speedSelect").selectOption("60");
            await page.waitForFunction(()=>document.querySelector("#saveState")?.textContent.includes("Salvataggio completato"));
            await sleep(1600);
            await page.locator("#saveBtn").click();
            await page.waitForFunction(()=>document.querySelector("#saveState")?.textContent.includes("Salvataggio completato"));
            const before=await checkpoint(page);
            assert.ok(before&&before.population>0&&before.lastWallTime>0,"IndexedDB checkpoint missing");
            assert.equal(before.speed,60);
            assert.equal(before.paused,false);
            assert.ok(serial(before)>1,"worker did not advance the calendar");

            await page.close();
            await sleep(1800);
            page=await context.newPage();
            page.on("pageerror",e=>errors.push(e.message));
            const resumedWorker=page.waitForEvent("worker",{timeout:20000});
            await page.goto(url,{waitUntil:"domcontentloaded"});
            assert.ok((await resumedWorker).url().includes("sim-worker.js"),"worker did not restart after reopening");
            await page.waitForFunction(()=>document.querySelector("#saveState")?.textContent.includes("Stato ripristinato e salvato"),null,{timeout:30000});
            assert.equal(await page.locator("#errorPanel").isHidden(),true);
            const after=await checkpoint(page);
            assert.ok(after&&after.population>0&&serial(after)>serial(before),"offline elapsed time was not recovered");
            assert.equal(after.speed,before.speed);
            assert.deepEqual(errors,[],"uncaught browser exceptions");
            console.log(JSON.stringify({result:"PASS",before:{year:before.year,day:before.day},after:{year:after.year,day:after.day},recoveredDays:serial(after)-serial(before)}));
            await context.close();
          }finally{
            if(browser)await browser.close();
            await new Promise(resolve=>server.close(resolve));
          }
          NODE
