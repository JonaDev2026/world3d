<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<canvas id="game"></canvas><div id="hud">
<div id="brand" class="panel">WORLD <small>TERRE ANTICHE · 0.7</small></div>
<div id="coords" class="panel">X 0 · Z 0</div><div id="crosshair"></div>
<div id="help" class="panel" data-i18n="controls"></div>

<div id="toast"></div><div id="playerName"></div>

<div class="previewStage"><canvas id="characterPreview"></canvas><span data-i18n="previewLabel">ANTEPRIMA 3D</span></div>

<div class="field"><label data-i18n="clothesLabel" for="creatorShirt"></label><select id="creatorShirt"><option value="#496b91">Blue</option><option value="#52794a">Green</option><option value="#914f45">Red</option><option value="#8171a8">Violet</option></select></div>
</div><button id="createPlayer" class="primary" data-i18n="enterWorld"></button></div></div>
<div id="pauseMenu" class="overlayMenu"><section class="menuCard"><header><div><h2>WORLD</h2><p data-i18n="paused">PAUSA</p></div><button id="resumeBtn" data-i18n="resume">RIPRENDI</button></header><nav class="menuTabs"><button id="menuMapBtn" data-i18n="worldMap">MAPPA</button><button id="menuSettingsBtn" data-i18n="settings">IMPOSTAZIONI</button></nav><div id="settingsPanel"><label><span data-i18n="viewMode">Visuale</span><select id="viewMode"><option value="first" data-i18n="firstPerson">Prima persona</option><option value="third" data-i18n="thirdPerson">Terza persona</option></select></label><label><span data-i18n="languageLabel">Lingua</span><select id="settingsLang"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></label><div class="audioSetting"><label><span data-i18n="music">Musica</span><input id="musicEnabled" type="checkbox" checked></label><input id="musicVolume" type="range" min="0" max="100" value="65"><small data-i18n="audioSoon">Controlli pronti · audio in arrivo</small></div><div class="audioSetting"><label><span data-i18n="sounds">Effetti sonori</span><input id="soundEnabled" type="checkbox" checked></label><input id="soundVolume" type="range" min="0" max="100" value="80"></div></div><footer><span data-i18n="pauseHint">ESC per tornare al gioco</span><button id="closeSettings" data-i18n="close">CHIUDI</button></footer></section></div>

<script type="module" src="./js/main.js"></script></body></html>
